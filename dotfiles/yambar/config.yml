bar:
  location: top
  height: 28
  font: monospace:pixelsize=14
  background: 1e1e2eff
  foreground: cdd6f4ff

  left:
    - i3:
        content:
          "":
            map:
              default:
                string: {text: "{name}", margin: 8}
              conditions:
                state == focused:
                  string:
                    text: "{name}"
                    margin: 8
                    deco: {underline: {size: 3, color: 89b4faff}}

  right:
    - battery:
        name: BAT0
        poll-interval: 30000
        content:
          string: {text: "BAT0 {capacity}%", margin: 8}
    - battery:
        name: BAT1
        poll-interval: 30000
        content:
          string: {text: "BAT1 {capacity}%", margin: 8}
    - clock:
        time-format: "%I:%M %p"
        content:
          - string: {text: "{date}", margin: 8}
          - string: {text: "{time}", margin: 8}
